{% extends "maestra.html" %}
{% block titulo %}405 Method Not Allowed{% endblock %}

{% block contenido %}


<div class="container d-flex flex-column justify-content-center align-items-center vh-100 text-center">
    <div class="card shadow-lg border-0 p-5" style="max-width: 600px; border-radius: 1rem;">
        <h1 class="display-3 text-danger fw-bold mb-3">405</h1>
        <h2 class="text-dark mb-3">Método no permitido</h2>
        <p class="text-muted mb-4">
            El método HTTP (GET, POST,etc) utilizado no está permitido para este recurso.
        </p>
        <a href="/" class="btn btn-danger px-4 py-2 rounded-pill shadow-sm">
            Volver al inicio
        </a>
    </div>
</div>

<style>
    body {
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        font-family: 'Poppins', sans-serif;
    }

    .card {
        background-color: #fff;
    }

    .btn-danger:hover {
        background-color: #c82333;
        transition: 0.3s;
    }
</style>
{% endblock %}
